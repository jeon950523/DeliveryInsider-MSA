server {
    listen 8080;
    server_name _;

    # Gateway 뒤에서는 upstream의 내부 포트(8080)를 Location 헤더에 노출하지 않는다.
    # /simulator -> /simulator/ 리다이렉트를 클라이언트가 현재 origin에서 처리하게 한다.
    absolute_redirect off;
    port_in_redirect off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /simulator {
        return 308 /simulator/;
    }

    location /simulator/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /simulator/index.html;
    }

    location ~* ^/simulator/.*\.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
