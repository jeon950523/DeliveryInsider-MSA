server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /simulator {
        return 308 /simulator/;
    }

    location /simulator/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /simulator/index.html;
    }

    location ~* ^/simulator/.*\.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
