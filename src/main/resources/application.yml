server:
  port: ${APP_PORT:8093}
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: baef-p2-platform
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:baef_platform}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

deliveryinsider:
  kafka:
    platform-order-topic: platform.order-events
    publish-timeout-ms: 10000

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

security:
  internal:
    api-key: ${GEMINI_API_KEY:}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

provider:
  baemin:
    webhook-secret: ${BAEMIN_WEBHOOK_SECRET:}
  coupang-eats:
    webhook-secret: ${COUPANG_EATS_WEBHOOK_SECRET:}
  yogiyo:
    webhook-secret: ${YOGIYO_WEBHOOK_SECRET:}
  ddangyo:
    webhook-secret: ${DDANGYO_WEBHOOK_SECRET:}
webhook:
  worker:
    enabled: ${WEBHOOK_WORKER_ENABLED:false}
    fixed-delay-ms: ${WEBHOOK_WORKER_FIXED_DELAY_MS:500}
    retry-delay-seconds: ${WEBHOOK_WORKER_RETRY_DELAY_SECONDS:30}
    max-retry-count: ${WEBHOOK_WORKER_MAX_RETRY_COUNT:5}
provider-client:
  baemin:
    base-url: ${BAEMIN_API_BASE_URL:http://localhost:8101}
  coupang-eats:
    base-url: ${COUPANG_EATS_API_BASE_URL:http://localhost:8101}
  yogiyo:
    base-url: ${YOGIYO_API_BASE_URL:http://localhost:8101}
  ddangyo:
    base-url: ${DDANGYO_API_BASE_URL:http://localhost:8101}
