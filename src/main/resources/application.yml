server:
  port: ${APP_PORT:8091}

spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: baef-p2-auth

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:baef_auth}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

security:
  internal:
    api-key: ${GEMINI_API_KEY:}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  issuer: deliveryinsider
  header-key: Authorization
  scheme: Bearer
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:1800000}
  refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:1209600000}
  refresh-token-cookie-name: refresh-token
  secret: ${JWT_SECRET:}
