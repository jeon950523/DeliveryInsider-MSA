server:
  port: ${APP_PORT:8095}
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: baef-p2-report
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:baef_report}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: ${REPORT_ORDER_CONSUMER_GROUP:report-order-event-group}
    listener:
      ack-mode: record
report:
  kafka:
    order-event-topic: ${ORDER_EVENT_TOPIC:order.events}
    order-event-dlt-topic: ${ORDER_EVENT_REPORT_DLT_TOPIC:order.events.report.DLT}
    order-consumer-group: ${REPORT_ORDER_CONSUMER_GROUP:report-order-event-group}
    retry-interval-ms: ${REPORT_KAFKA_RETRY_INTERVAL_MS:1000}
    max-attempts: ${REPORT_KAFKA_MAX_ATTEMPTS:3}
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

security:
  internal:
    api-key: ${GEMINI_API_KEY:}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
store-client:
  base-url: ${STORE_SERVICE_URL:http://localhost:8092}
  internal-api-key: ${INTERNAL_API_KEY:}
  connect-timeout: ${STORE_CLIENT_CONNECT_TIMEOUT:2s}
  read-timeout: ${STORE_CLIENT_READ_TIMEOUT:3s}
platform-client:
  base-url: ${PLATFORM_SERVICE_URL:http://localhost:8093}
  internal-api-key: ${INTERNAL_API_KEY:}
  connect-timeout: ${PLATFORM_CLIENT_CONNECT_TIMEOUT:2s}
  read-timeout: ${PLATFORM_CLIENT_READ_TIMEOUT:3s}
billing-client:
  base-url: ${BILLING_SERVICE_URL:http://localhost:8097}
  internal-api-key: ${INTERNAL_API_KEY:}
  connect-timeout: ${BILLING_CLIENT_CONNECT_TIMEOUT:2s}
  read-timeout: ${BILLING_CLIENT_READ_TIMEOUT:3s}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
  read-timeout: ${GEMINI_READ_TIMEOUT:12s}
