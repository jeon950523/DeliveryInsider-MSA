server:
  port: ${APP_PORT:8080}

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: baef-p2-scg
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
#               allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-origin-patterns: "http://localhost:*"
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: notification-api
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8096}
              predicates:
                - Path=/api/notifications/**

            - id: notification-websocket
              uri: ${NOTIFICATION_WEBSOCKET_URI:ws://localhost:8096}
              predicates:
                - Path=/ws/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8091}
              predicates:
                - Path=/api/auth/**
            - id: store-service
              uri: ${STORE_SERVICE_URI:http://localhost:8092}
              predicates:
                - Path=/api/stores/**,/api/menus/**
            - id: platform-service
              uri: ${PLATFORM_SERVICE_URI:http://localhost:8093}
              predicates:
                - Path=/api/platform-integrations/**,/external/providers/**
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8094}
              predicates:
                - Path=/api/orders/**
            - id: billing-service
              uri: ${BILLING_SERVICE_URI:http://localhost:8097}
              predicates:
                - Path=/api/billing/**
            - id: report-service
              uri: ${REPORT_SERVICE_URI:http://localhost:8095}
              predicates:
                - Path=/api/reports/**
            # OpenAPI specs: 하위 서비스 UI는 끄고 SCG /docs에서 통합한다.
            - id: auth-service-docs
              uri: ${AUTH_SERVICE_URI:http://localhost:8091}
              predicates:
                - Path=/auth-service/api-docs
              filters:
                - RewritePath=/auth-service/api-docs,/api-docs
            - id: store-service-docs
              uri: ${STORE_SERVICE_URI:http://localhost:8092}
              predicates:
                - Path=/store-service/api-docs
              filters:
                - RewritePath=/store-service/api-docs,/api-docs
            - id: platform-service-docs
              uri: ${PLATFORM_SERVICE_URI:http://localhost:8093}
              predicates:
                - Path=/platform-service/api-docs
              filters:
                - RewritePath=/platform-service/api-docs,/api-docs
            - id: order-service-docs
              uri: ${ORDER_SERVICE_URI:http://localhost:8094}
              predicates:
                - Path=/order-service/api-docs
              filters:
                - RewritePath=/order-service/api-docs,/api-docs
            - id: report-service-docs
              uri: ${REPORT_SERVICE_URI:http://localhost:8095}
              predicates:
                - Path=/report-service/api-docs
              filters:
                - RewritePath=/report-service/api-docs,/api-docs
            - id: notification-service-docs
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8096}
              predicates:
                - Path=/notification-service/api-docs
              filters:
                - RewritePath=/notification-service/api-docs,/api-docs
            - id: billing-service-docs
              uri: ${BILLING_SERVICE_URI:http://localhost:8097}
              predicates:
                - Path=/billing-service/api-docs
              filters:
                - RewritePath=/billing-service/api-docs,/api-docs

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway

springdoc:
  swagger-ui:
    path: /docs
    urls:
      - name: auth-service
        url: /auth-service/api-docs
      - name: store-service
        url: /store-service/api-docs
      - name: platform-service
        url: /platform-service/api-docs
      - name: order-service
        url: /order-service/api-docs
      - name: report-service
        url: /report-service/api-docs
      - name: notification-service
        url: /notification-service/api-docs
      - name: billing-service
        url: /billing-service/api-docs

jwt:
  header-key: Authorization
  scheme: Bearer
  issuer: deliveryinsider
  secret: ${JWT_SECRET:}


# TODO: /api/** JWT 검증 + X-User-Id 신뢰 헤더 주입은 Auth 구현과 함께 연결한다.
# /internal/** 는 Public SCG Route로 만들지 않는다. 내부 서비스는 ClusterIP로 직접 호출한다.
# /external/** 는 User JWT 경계가 아니라 Platform의 Provider Signature/HMAC 검증 대상이다.
# Report Public REST prefix와 Notification WebSocket endpoint는 실제 API 계약 확정 후 Route 추가한다.
