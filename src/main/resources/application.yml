server:
  port: ${APP_PORT:8096}
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: baef-p2-notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

security:
  internal:
    api-key: ${GEMINI_API_KEY:}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
notification:
  kafka:
    order-event-topic: ${ORDER_EVENT_TOPIC:order.events}
    order-event-dlt-topic: ${ORDER_EVENT_NOTIFICATION_DLT_TOPIC:order.events.notification.DLT}
    order-consumer-group: ${NOTIFICATION_ORDER_CONSUMER_GROUP:notification-order-event-group}
    retry-interval-ms: ${NOTIFICATION_KAFKA_RETRY_INTERVAL_MS:1000}
    max-attempts: ${NOTIFICATION_KAFKA_MAX_ATTEMPTS:3}
  websocket:
      ticket-ttl: ${WEBSOCKET_TICKET_TTL:30s}
store-client:
  base-url: ${STORE_SERVICE_URL:http://localhost:8092}
  internal-api-key: ${INTERNAL_API_KEY:}
  connect-timeout: ${STORE_CLIENT_CONNECT_TIMEOUT:2s}
  read-timeout: ${STORE_CLIENT_READ_TIMEOUT:3s}
