store-client:
  base-url: ${STORE_SERVICE_URL:http://localhost:8092}
  internal-api-key: ${INTERNAL_API_KEY:}
  connect-timeout: ${STORE_CLIENT_CONNECT_TIMEOUT:2s}
  read-timeout: ${STORE_CLIENT_READ_TIMEOUT:3s}
server:
  port: ${APP_PORT:8097}
spring:
  application:
    name: baef-p2-billing
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:baef_billing}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

security:
  internal:
    api-key: ${GEMINI_API_KEY:}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

billing:
  scheduler-enabled: ${BILLING_SCHEDULER_ENABLED:true}
  scheduler-fixed-delay-ms: ${BILLING_SCHEDULER_FIXED_DELAY_MS:3000}
  toss-secret-key: ${TOSS_SECRET_KEY:}
  subscription:
    expiration:
      fixed-delay-ms: ${BILLING_SUBSCRIPTION_EXPIRATION_DELAY_MS:3000}
      batch-size: ${BILLING_SUBSCRIPTION_EXPIRATION_BATCH_SIZE:50}
  kafka:
    topic: ${BILLING_EVENTS_TOPIC:billing.events}
  payment:
    reconciliation:
      fixed-delay-ms: ${BILLING_PAYMENT_RECONCILIATION_DELAY_MS:5000}
    mock:
      mode: ${BILLING_MOCK_PAYMENT_MODE:SUCCESS}
      reconcile-mode: UNKNOWN #${BILLING_MOCK_PAYMENT_RECONCILE_MODE:UNKNOWN}
  outbox:
    publisher:
      fixed-delay-ms: ${BILLING_OUTBOX_FIXED_DELAY_MS:500}
      batch-size: ${BILLING_OUTBOX_BATCH_SIZE:20}
      lease-seconds: ${BILLING_OUTBOX_LEASE_SECONDS:30}
